name: CI

on:
  pull_request:
  push:
    branches: [next, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The check reads the same tracked files on every OS, so one OS runs it.
      - if: runner.os == 'Linux'
        run: npm run check:chars
      - run: npm test
      # Linux runners have no display, so Electron runs under a virtual X server.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
